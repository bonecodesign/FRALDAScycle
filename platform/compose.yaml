services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraldacycle
      POSTGRES_USER: fraldacycle
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - fraldacycle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraldacycle -d fraldacycle"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4200
      DATABASE_URL: postgresql://fraldacycle:local-development-only@postgres:5432/fraldacycle
      DATABASE_SSL: "false"
      SESSION_SECRET: local-development-secret-change-before-production
      CORS_ORIGINS: http://127.0.0.1:4101,http://127.0.0.1:4102,http://127.0.0.1:4103
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fraldacycle_postgres:
