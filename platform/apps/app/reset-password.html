<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FraldaCycle — aplicativo de economia circular">
  <title>FraldaCycle — App · nova senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/packages/ui/source-adapter.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <main id="main" tabindex="-1" data-surface="app" data-architecture-route="/app/reset-password">
    <section class="app-stage auth-stage">
      <nav class="app-menu" aria-label="Fluxo de autenticação"><a href="/app/login">Login</a><a href="/app/recovery">Recuperação</a><a href="/app/verify">Verificação</a></nav>
      <div class="phone auth-phone"><div class="phone-top">9:41</div>
        <form class="mobile-auth recovery-screen" id="reset-password-form">
          <a class="back-link" href="/app/recovery">←</a>
          <span class="eyebrow">Recuperação segura</span>
          <h1>Crie uma nova senha</h1>
          <p>Use pelo menos 12 caracteres para proteger sua conta.</p>
          <div class="form-group"><label>Nova senha</label><input class="input" type="password" required minlength="12" autocomplete="new-password"></div>
          <div class="form-group"><label>Confirmar senha</label><input class="input" type="password" required minlength="12" autocomplete="new-password"></div>
          <small class="field-error" role="alert"></small>
          <button class="button primary block" type="submit">Salvar nova senha</button>
        </form>
      </div>
      <aside class="context-panel"><span class="eyebrow">Autenticação e identidade</span><h2>Nova senha</h2><p class="muted">Extensão arquitetural necessária para concluir o fluxo de recuperação aprovado.</p></aside>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/apps/app/auth.js"></script>
</body>
</html>
