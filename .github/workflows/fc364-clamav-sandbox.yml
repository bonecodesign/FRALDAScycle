name: FC-364 Real ClamAV sandbox (public standard runner)

# Opt-in real AV check: only a PR touching this workflow or this AV lab.
# Standard GitHub-hosted Linux runners are free for PUBLIC repositories.
# No self-hosted/larger runner, secrets, caches, artifacts or production side effects.
on:
  pull_request:
    paths:
      - ".github/workflows/fc364-clamav-sandbox.yml"
      - "platform/tools/media-local-antivirus-lab.mjs"
      - "platform/tests/media-local-antivirus-lab.test.mjs"
      - "platform/tools/media-local-chain.py"
      - "platform/tools/media-local-chain.mjs"
      - "platform/tests/media-local-chain.test.mjs"
      - "platform/tools/media-local-lab.py"
      - "platform/tests/media_decode_preflight_test.py"
      - "platform/tools/media-local-batches.mjs"
      - "platform/tests/media-local-batches.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc364-clamav-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-clamav:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install ClamAV only in the temporary free public runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clamav clamav-freshclam tesseract-ocr tesseract-ocr-eng time
          # Avoid the background updater holding the database lock.
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          command -v clamscan
          command -v sigtool
          command -v freshclam
      - name: Update official ClamAV signatures (fail closed if denied)
        shell: bash
        run: |
          set -euo pipefail
          # A network problem or upstream rate limit is a BLOCKED result,
          # not permission to scan with stale/missing definitions.
          timeout 420s sudo freshclam --stdout
          test -f /var/lib/clamav/daily.cvd -o -f /var/lib/clamav/daily.cld
      - name: Exercise real, isolated clean-image and harmless EICAR scans
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/media-local-antivirus-lab.test.mjs
          # Returns exit 2 if real scan, signatures or results are invalid.
          # Never prints raw scan text or claims production readiness.
          node tools/media-local-antivirus-lab.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned open-source synthetic image test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all:             Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88             pytesseract==0.3.13 qrcode==8.2
      - name: Verify actual image decoder preflight and static-only policy
        working-directory: platform
        shell: bash
        run: python tests/media_decode_preflight_test.py
      - name: Execute complete synthetic source AV to WebP output AV OCR QR gate
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/media-local-chain.test.mjs
          # This invokes real ClamAV on source AND converted images. It
          # never returns production "clean" and fails closed if AV is missing.
          # FC-434: report only numeric resource metrics, not raw OCR or input data.
          printf 'FC-434 runner logical CPUs: '; getconf _NPROCESSORS_ONLN
          awk '/^MemTotal:/ {print "FC-434 runner memory KiB: " $2}' /proc/meminfo
          /usr/bin/time -f 'FC-434 sequential elapsed_s=%e user_cpu_s=%U system_cpu_s=%S max_single_process_rss_kib=%M exit=%x' node tools/media-local-chain.mjs
      - name: FC-435 measure aggregate media memory under a constrained synthetic host envelope
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          # Separate disposable cgroup, not the planned VPS or a production SLA.
          # Execute repository code as the ordinary runner, never as root.
          # One CPU of quota and 2 GiB total memory (including children/cache).
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo systemd-run --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="PYTHON=$(command -v python)" \
            --property=CPUQuota=100% --property=MemoryMax=2G \
            --property=MemorySwapMax=0 --property=RuntimeMaxSec=180 \
            /bin/bash -eu -c '
              cg=$(sed -n "s/^0:://p" /proc/self/cgroup)
              test -n "$cg"
              dir="/sys/fs/cgroup$cg"
              test "$(cat "$dir/memory.max")" = 2147483648
              test "$(cat "$dir/memory.swap.max")" = 0
              awk "\$1 != \$2 {exit 1}" "$dir/cpu.max"
              test -r "$dir/memory.peak"
              printf "FC-435 memory.max bytes: "; cat "$dir/memory.max"
              printf "FC-435 cpu.max: "; cat "$dir/cpu.max"
              /usr/bin/time -f "FC-435 elapsed_s=%e exit=%x" node tools/media-local-chain.mjs
              printf "FC-435 aggregate memory.peak bytes: "; cat "$dir/memory.peak"
              awk "/^oom / || /^oom_kill / {print \"FC-435 memory.events \" \$0; if (\$2 != 0) bad=1} END {exit bad}" "$dir/memory.events"
            '
      - name: Exercise bounded concurrent real-AV artificial listing batches
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/media-local-batches.test.mjs
          # Six artificial images in 3 listings; no external media service,
          # data, approval or reusable clean attestation. Both source
          # and WebP are scanned using real ClamAV in up to 2 workers.
          # GNU time peak RSS is not aggregate concurrent memory or a production SLA.
          /usr/bin/time -f 'FC-434 concurrent elapsed_s=%e user_cpu_s=%U system_cpu_s=%S max_single_process_rss_kib=%M exit=%x' node tools/media-local-batches.mjs
