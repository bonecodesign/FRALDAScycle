name: FC-373 Supabase Native recovery tooling
# Public standard runner, tools ONLY. No hosted project credentials, no
# production data, no upload-artifact/cache, no scheduled run or deployment.
on:
  pull_request:
    paths:
      - ".github/workflows/fc373-native-recovery.yml"
      - "platform/tools/fc375-native-restore-lab.sh"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fc373-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tools:
    if: github.repository == 'bonecodesign/FRALDAScycle' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1, resolved in run 45518516391
        with:
          version: "3.2.0"
      - name: Ensure PostgreSQL 17 host client (temporary standard runner)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump ]]; then
            sudo apt-get update -qq
            if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
              sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
              sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/fc375-pgdg.list >/dev/null
              sudo apt-get update -qq
            fi
            sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Prepare official native runtime in a new unlinked workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL
          export SUPABASE_EXPERIMENTAL_STACK=1
          export SUPABASE_HOME="$RUNNER_TEMP/fc373-supabase-home"
          workspace="$(mktemp -d "$RUNNER_TEMP/fc373-native-XXXXXXXX")"
          mkdir -m 700 "$SUPABASE_HOME"
          cd "$workspace"
          cleanup() {
            supabase stack stop > "$workspace/stop.log" 2>&1 || true
            rm -rf -- "$workspace" "$SUPABASE_HOME"
          }
          trap cleanup EXIT
          test "$(supabase --version)" = "3.2.0"
          echo "FC373_CLI_VERSION=PASS"
          supabase init > init.log 2>&1
          echo "FC373_INIT=PASS"
          python3 - <<'PY'
          import pathlib, re, tomllib
          path=pathlib.Path("supabase/config.toml")
          config=path.read_text()
          config,n=re.subn(r'(?m)^major_version\s*=\s*\d+\s*$', 'major_version = 17', config)
          assert n == 1
          path.write_text(config)
          assert tomllib.loads(config)["db"]["major_version"] == 17
          PY
          test ! -e supabase/.temp/project-ref
          # Capture full help before checking flags: avoid grep -q / SIGPIPE
          # under pipefail, and use explicit stack commands rather than aliases.
          supabase stack start --help > start-help.txt 2>&1
          cat start-help.txt
          grep -F -- '--runtime' start-help.txt >/dev/null
          echo "FC373_CLI_PIN_AND_UNLINKED_PG17_CONFIG=PASS"
          # start downloads the verified official tools on first execution.
          if ! supabase stack start --runtime native --eager > start.log 2>&1; then
            echo "::error::FC373_NATIVE_START_FAILED (private local log discarded)"
            exit 1
          fi
          test -d "$SUPABASE_HOME/cache/stack"
          count="$(find "$SUPABASE_HOME/cache/stack" -type f | wc -l)"
          test "$count" -gt 0
          echo "FC373_OFFICIAL_NATIVE_TOOL_PREPARATION=PASS files=$count"
          supabase stack status --output-format json > status.json
          python3 - <<'PY'
          import json
          data=json.load(open("status.json"))
          assert data.get("runtime") == "native", "Native runtime not confirmed"
          print("FC373_NATIVE_RUNTIME=PASS")
          PY
          # New compatibility exercise: native PG17 archive with synthetic public
          # rows, restored only in a fresh, separately initialized local Native
          # instance. Its managed Auth/Storage relations remain untouched.
          bash "$GITHUB_WORKSPACE/platform/tools/fc375-native-restore-lab.sh" "$workspace" "$SUPABASE_HOME"
          echo "FC373_HOSTED_BACKUP_NOT_EXECUTED"
          echo "FC373_HOSTED_RESTORE_NOT_EXECUTED"
